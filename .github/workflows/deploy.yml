name: Deploy Phish Analyzer

# test: runs on GitHub's hosted runner (isolated, no AD/DB needed for these tests).
# deploy: runs on the self-hosted runner on the Ubuntu VM itself, only if tests pass.
# See README.md "GitHub auto-deploy setup" for how to register the runner.
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run unit tests
        run: pytest tests/ -v

  deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Restore .env from secrets location
        run: cp ~/.secrets/phishapp.env .env

      - name: Rebuild and restart containers
        run: |
          docker compose down
          docker compose up -d --build

      - name: Wait for app to come up
        run: |
          for i in {1..10}; do
            if curl -sf http://localhost:8000/health; then
              echo "App is healthy"
              exit 0
            fi
            echo "Waiting for app..."
            sleep 3
          done
          echo "App did not become healthy in time"
          exit 1
